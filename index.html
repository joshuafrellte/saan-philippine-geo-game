<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#07161c" />
    <title>Saan? Philippine geography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="shell" id="shell">
      <header class="top">
        <div>
          <p class="eyebrow">Philippine geography</p>
          <h1>Saan<span>?</span></h1>
        </div>
        <div class="top-side">
          <button type="button" id="study-open" class="study-open" aria-pressed="false">Study</button>
        </div>
      </header>
      <nav class="modes" id="modes" aria-label="Quiz modes"></nav>
      <div class="map-column">
        <div class="map-wrap">
          <svg id="map" role="img" aria-label="Map of the Philippines"></svg>
          <p id="hover-label" class="hover-label" hidden aria-hidden="true"></p>
          <div class="zoom-controls" aria-label="Map zoom">
            <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
            <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
            <button type="button" data-zoom="reset" aria-label="Reset the map">⌂</button>
          </div>
        </div>
        <p class="credit">Land shapes from geoBoundaries (CC BY 3.0 IGO) and Faeldon / PSGC (MIT). Regions include the Negros Island Region, and Sulu in the Zamboanga Peninsula.</p>
      </div>
      <div class="side">
        <section class="prompt">
          <div class="score" id="score" aria-label="Score"></div>
          <p id="prompt" aria-live="polite"></p>
          <p id="hint" class="hint"></p>
          <div id="study-card" class="study-card" hidden></div>
        </section>
        <section class="dock" id="dock"></section>
      </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
